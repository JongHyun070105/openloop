[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://mrodt7pxq4.execute-api.ap-northeast-2.amazonaws.com/dev/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dev/*"
  to = "https://mrodt7pxq4.execute-api.ap-northeast-2.amazonaws.com/dev/:splat"
  status = 200
  force = true
